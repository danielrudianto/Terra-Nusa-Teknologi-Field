name: terrabot_field
description: TerraBot Field — aplikasi lapangan AKN (absensi kru & log pengecoran), offline-first.
publish_to: "none"
version: 0.1.0+1

environment:
  # Flutter stable per Oktober 2026 = 3.47 (Dart 3.12). Versi paket di bawah
  # diperiksa terhadap kode sumbernya pada rilis terbaru masing-masing.
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigasi
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # Basis data lokal (offline-first). sqlite3_flutter_libs TIDAK dipakai
  # lagi: sejak drift 2.32 / sqlite3 3.x, SQLite dibundel lewat build hook.
  drift: ^2.35.1
  drift_flutter: ">=0.3.1 <1.0.0"
  path_provider: ^2.1.5
  path: ^1.9.0

  # Jaringan & sesi
  dio: ^5.8.0
  flutter_secure_storage: ^11.2.0
  workmanager: ">=0.10.10 <1.0.0"

  # Perangkat
  geolocator: ^14.1.1
  image_picker: ^1.2.0
  flutter_image_compress: ^2.4.0
  google_mlkit_face_detection: ">=0.13.0 <1.0.0"
  flutter_local_notifications: ^22.3.1
  jam_monoton:
    path: packages/jam_monoton

  # Utilitas
  uuid: ^4.5.1
  crypto: ^3.0.6
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"
  build_runner: ^2.4.15
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true

  # Montserrat, sama dengan TerraBot web. Taruh berkas TTF-nya di
  # assets/fonts/ (lihat BACA-DULU.md) — dibundel supaya tetap tampil
  # sama tanpa sinyal.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
