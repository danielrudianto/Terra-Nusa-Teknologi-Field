name: terrabot_field
description: TerraBot Field — AKN field app (crew attendance & pile casting log), offline-first.
publish_to: "none"
version: 1.0.0+10

environment:
  # Flutter stable as of October 2026 = 3.47 (Dart 3.12). The package versions below
  # were checked against the source code of each latest release.
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # Local database (offline-first). sqlite3_flutter_libs is NO LONGER used:
  # since drift 2.32 / sqlite3 3.x, SQLite is bundled via a build hook.
  drift: ^2.35.1
  drift_flutter: ">=0.3.1 <1.0.0"
  path_provider: ^2.1.5
  path: ^1.9.0

  # Network & session
  dio: ^5.8.0
  flutter_secure_storage: ^11.2.0
  workmanager: ">=0.10.10 <1.0.0"

  # Device
  # Merek dan tipe HP untuk header X-Device-Name; lihat core/device/device_name.dart.
  device_info_plus: ^13.3.0
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  gal: ^2.3.3
  image_picker: ^1.2.0
  flutter_image_compress: ^2.4.0
  google_mlkit_face_detection: ">=0.13.0 <1.0.0"
  flutter_local_notifications: ^22.3.1
  # Scheduled reminders take a TZDateTime; already a dependency of the
  # notifications plugin, listed here because the app imports it.
  timezone: ^0.11.0
  monotonic_clock:
    path: packages/monotonic_clock

  # Utilities
  uuid: ^4.5.1
  crypto: ^3.0.6
  intl: ^0.20.2
  # Hand the downloaded Excel recap to WhatsApp, e-mail, Drive or a sheet app.
  share_plus: ^13.0.0
  # Real installed version for X-App-Version (the server's minimum check).
  package_info_plus: ^10.0.0
  # "Unduh versi baru" on the update page opens the APK / Play link.
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"
  build_runner: ^2.4.15
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
  # Membangkitkan AppLocalizations dari lib/l10n/*.arb (lihat l10n.yaml).
  generate: true

  # Montserrat, same as TerraBot web. Put the TTF files in
  # assets/fonts/ (see SETUP.md) — bundled so the look stays
  # the same without signal.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
